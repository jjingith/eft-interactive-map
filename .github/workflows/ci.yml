# 测试门禁：push / PR 时跑全量 pytest。
#
# 为什么不在这里构建安装包：
#   构建需要三样没进版本库的东西 —— `tools/host/src/*.cs`（客户端壳源码）、
#   `data/items.json`（构建产物，需联网跑 fetch_data）、`assets/icons-items/`（5400+ 图标）。
#   要么把它们提交进仓库（图标 200MB+，不合适），要么接对象存储做构建缓存，
#   都还没做。所以 CI 只守住「代码不退化」，出包仍走本机 build/build_release.ps1。
#
# 已知基线：18 条既有失败（test_r42_live_prices 14 / test_r44_mode_live 3 /
# test_r215_remove_spawn_frame 1，均为重构后未同步的旧契约）。
# `--deselect` 把已知失败摘掉，这样「新增失败」会如实变红；清理完这些债务后
# 应删除下面的 deselect 列表。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装测试依赖
        run: python -m pip install --upgrade pip pytest pillow

      - name: 语法检查（Python / JS）
        shell: pwsh
        run: |
          python -m py_compile tools/serve.py tools/scan.py tools/fetch_data.py tools/price_collect.py tools/market_overview.py
          if (Get-Command node -ErrorAction SilentlyContinue) {
            node --check app.js
            node --check tasks.js
            node --check js/market-board.js
          }

      - name: 全量回归
        shell: pwsh
        run: |
          python -m pytest tests/ -q --tb=short `
            --deselect tests/test_r42_live_prices.py `
            --deselect tests/test_r44_mode_live.py `
            --deselect tests/test_r215_remove_spawn_frame.py::test_result_containers_stay_and_belong_to_the_panel
